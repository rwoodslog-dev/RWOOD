<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Notybat — Réponse aux congés</title>
<link rel="icon" href="icons/icon-192-v4.png">
<style>
  body{ margin:0; background:#EEF1F5; font-family:Arial,Helvetica,sans-serif; color:#1B2333; }
  .c{ max-width:460px; margin:40px auto; background:#fff; border-radius:16px; overflow:hidden; border:1px solid #DDE2EA; }
  .h{ background:#1B2A44; padding:14px 18px; display:flex; align-items:center; gap:10px; color:#fff; font-size:20px; font-weight:bold; }
  .h img{ width:36px; height:36px; border-radius:8px; }
  .h span{ color:#F29A3F; }
  .bar{ height:4px; background:#EE8A2E; }
  .b{ padding:24px 20px; text-align:center; }
  .ic{ font-size:46px; line-height:1; }
  h2{ margin:8px 0 10px; }
  p{ color:#33405A; line-height:1.5; margin:0 0 18px; }
  a.go, button.go{ display:block; width:100%; box-sizing:border-box; background:#EE8A2E; color:#1A0F04; text-decoration:none; font-weight:bold; font-size:15px; padding:13px 16px; border-radius:12px; border:0; cursor:pointer; margin:0 0 8px; font-family:inherit; }
  a.alt, button.alt{ background:#fff; color:#1B2A44; border:2px solid #DDE2EA; }
  .preview{ text-align:left; background:#F5F7FA; border-radius:10px; padding:12px; font-size:13px; color:#33405A; white-space:pre-wrap; margin:0 0 14px; max-height:220px; overflow:auto; }
  .preview b{ display:block; margin-bottom:6px; color:#1B2333; }
  small{ display:block; font-size:12px; color:#8A93A3; margin-top:12px; }
  @media (max-width:500px){ .c{ margin:16px; } }
</style>
</head>
<body>
<div class="c">
  <div class="h"><img src="icons/icon-192-v4.png" alt=""><b>Noty<span>bat</span></b></div>
  <div class="bar"></div>
  <div class="b">
    <div class="ic" id="ic">✓</div>
    <h2 id="t">Réponse enregistrée</h2>
    <p id="m"></p>
    <div id="mailbox" style="display:none;">
      <div class="preview" id="pv"></div>
      <a class="go" id="go" href="#">✉&nbsp; Ouvrir dans mon application e-mail</a>
      <a class="go alt" id="gm" href="#" target="_blank" rel="noopener">Ouvrir dans Gmail</a>
      <a class="go alt" id="ol" href="#" target="_blank" rel="noopener">Ouvrir dans Outlook</a>
      <button class="go alt" id="cp" type="button">Copier le message</button>
      <small>Choisis la boîte mail que tu utilises : le message est déjà écrit, il ne reste qu'à l'envoyer.</small>
    </div>
  </div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search), k = q.get('k') || 'ok', mt = q.get('mt') || '';
  var ic = document.getElementById('ic');
  ic.textContent = k === 'ok' ? '✓' : k === 'no' ? '✕' : '!';
  ic.style.color = k === 'ok' ? '#2E9E5B' : k === 'no' ? '#C0392B' : '#C46A12';
  document.getElementById('t').textContent = q.get('t') || 'Réponse enregistrée';
  document.getElementById('m').textContent = q.get('m') || '';
  if(/^mailto:/i.test(mt)){
    var qi = mt.indexOf('?'), to = decodeURIComponent(mt.slice(7, qi < 0 ? undefined : qi)), mp = new URLSearchParams(qi < 0 ? '' : mt.slice(qi + 1).replace(/\+/g, '%2B'));
    var su = mp.get('subject') || '', bo = mp.get('body') || '';
    document.getElementById('mailbox').style.display = 'block';
    document.getElementById('pv').innerHTML = '';
    var b = document.createElement('b'); b.textContent = (to ? 'À : ' + to + '\n' : '') + 'Objet : ' + su; document.getElementById('pv').appendChild(b);
    document.getElementById('pv').appendChild(document.createTextNode(bo));
    var e = encodeURIComponent;
    document.getElementById('go').href = 'mailto:' + e(to) + '?subject=' + e(su) + '&body=' + e(bo);
    document.getElementById('gm').href = 'https://mail.google.com/mail/?view=cm&fs=1&to=' + e(to) + '&su=' + e(su) + '&body=' + e(bo);
    document.getElementById('ol').href = 'https://outlook.office.com/mail/deeplink/compose?to=' + e(to) + '&subject=' + e(su) + '&body=' + e(bo);
    document.getElementById('cp').onclick = function(){
      var t = (to ? 'À : ' + to + '\n' : '') + 'Objet : ' + su + '\n\n' + bo, btn = this;
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ btn.textContent = 'Message copié ✓'; }, function(){ btn.textContent = 'Copie impossible'; });
    };
  }
})();
</script>
</body>
</html>
