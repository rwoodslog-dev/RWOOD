<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Notybat — Réponse aux congés</title>
<link rel="icon" href="icons/icon-192-v4.png">
<style>
  body{ margin:0; background:#EEF1F5; font-family:Arial,Helvetica,sans-serif; color:#1B2333; }
  .c{ max-width:460px; margin:40px auto; background:#fff; border-radius:16px; overflow:hidden; border:1px solid #DDE2EA; }
  .h{ background:#1B2A44; padding:14px 18px; display:flex; align-items:center; gap:10px; color:#fff; font-size:20px; font-weight:bold; }
  .h img{ width:36px; height:36px; border-radius:8px; }
  .h span{ color:#F29A3F; }
  .bar{ height:4px; background:#EE8A2E; }
  .b{ padding:24px 20px; text-align:center; }
  .ic{ font-size:46px; line-height:1; }
  h2{ margin:8px 0 10px; }
  p{ color:#33405A; line-height:1.5; margin:0 0 18px; }
  a.go{ display:inline-block; background:#EE8A2E; color:#1A0F04; text-decoration:none; font-weight:bold; padding:13px 22px; border-radius:12px; }
  small{ display:block; font-size:12px; color:#8A93A3; margin-top:12px; }
  @media (max-width:500px){ .c{ margin:16px; } }
</style>
</head>
<body>
<div class="c">
  <div class="h"><img src="icons/icon-192-v4.png" alt=""><b>Noty<span>bat</span></b></div>
  <div class="bar"></div>
  <div class="b">
    <div class="ic" id="ic">✓</div>
    <h2 id="t">Réponse enregistrée</h2>
    <p id="m"></p>
    <a class="go" id="go" href="#" style="display:none;">✉&nbsp; Ouvrir l'e-mail de réponse</a>
    <small id="hint" style="display:none;">Ta boîte mail s'ouvre avec le message déjà écrit. Tu peux ensuite fermer cette page.</small>
  </div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search), k = q.get('k') || 'ok', mt = q.get('mt') || '';
  var ic = document.getElementById('ic');
  ic.textContent = k === 'ok' ? '✓' : k === 'no' ? '✕' : '!';
  ic.style.color = k === 'ok' ? '#2E9E5B' : k === 'no' ? '#C0392B' : '#C46A12';
  document.getElementById('t').textContent = q.get('t') || 'Réponse enregistrée';
  document.getElementById('m').textContent = q.get('m') || '';
  if(/^mailto:/i.test(mt)){
    var a = document.getElementById('go'); a.href = mt; a.style.display = 'inline-block';
    document.getElementById('hint').style.display = 'block';
    setTimeout(function(){ location.href = mt; }, 700);
  }
})();
</script>
</body>
</html>
